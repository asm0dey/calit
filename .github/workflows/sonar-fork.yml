# SonarQube Cloud analysis for fork pull requests.
#
# WHY THIS FILE EXISTS: GitHub withholds repository secrets from `pull_request` runs whose head is
# a fork, so ci.yml's test job skips them (its analysis step would fail on an empty SONAR_TOKEN)
# and fork-ci.yml builds them instead. Fork PRs used to merge with no quality gate, no coverage
# figure and no new-code check. `workflow_run` fires in the BASE repo's context once fork-ci.yml
# finishes, where secrets exist. This is the three-workflow split SonarSource documents.
#
# WHY THIS IS SAFE: a `workflow_run` job is privileged, so it must never execute code the fork
# wrote. This job runs Maven with the BASE branch's pom.xml, .mvn/ and mvnw — restored over the
# PR checkout after it lands — so the build configuration, plugin set and Sonar parameters are all
# ours. The fork supplies only analysis INPUT: its sources (re-fetched here from refs/pull/N/head,
# not from the artifact) and its compiled classes plus reports (from the artifact). The scanner
# reads those; it never runs them. No test, no plugin and no wrapper script from the fork executes.
#
# DELIBERATE DEVIATION: SonarSource's own example runs sonarqube-scan-action here rather than Maven.
# The standalone scanner cannot resolve a Maven classpath, and sonar.java.libraries — every
# dependency jar — is exactly what sonar-maven-plugin computes. Without it Java rules lose type
# resolution, so fork PRs would be measured by a weaker analysis than ours: a green gate that means
# less. Running Maven is safe here for the reason above — it is OUR pom, wrapper and .mvn/, not the
# fork's. Their warning is against running the fork's build (`mvn verify` runs fork-authored tests
# and plugins), which this job never does.
#
# Consequence worth knowing: a PR that edits pom.xml is analysed against the BASE pom. That is the
# point — a fork cannot widen sonar.issue.ignore or sonar.cpd.exclusions to hide its own findings —
# but it also means a PR adding a genuinely new source root or report path needs the base pom to
# learn about it first.
name: SonarQube (fork PRs)

on:
  workflow_run:
    workflows: ["CI (fork PRs)"]
    types: [completed]

# Deliberately minimal: this job holds SONAR_TOKEN, so GITHUB_TOKEN gets read-only scopes. Sonar
# Cloud decorates the PR through its own GitHub App, not through this token.
permissions:
  actions: write # only to delete the analysed artifact once the scan has read it
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: SonarQube Cloud analysis (fork PR)
    # Only successful CI runs for pull requests raised from a fork. A same-repo PR was already
    # analysed inside ci.yml, and re-running here would report the same analysis twice.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      # The PR number is resolved from the API by head SHA, never read out of the artifact: the
      # artifact is fork-controlled, and a forged number would post this analysis onto someone
      # else's pull request. workflow_run.pull_requests is empty for forks, hence the lookup.
      - name: Resolve the pull request from the head SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
                 --jq '[.[] | select(.state == "open")] | first // empty')
          if [ -z "$pr" ]; then
            echo "No open PR has head $HEAD_SHA — nothing to analyse."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number=$(jq -r .number <<<"$pr")
          branch=$(jq -r .head.ref <<<"$pr")
          base=$(jq -r .base.ref <<<"$pr")
          # The branch name is chosen by the fork, and git permits ' ; ` $( ) in a ref name. These
          # values reach a shell and the scanner's argument list in a job that holds SONAR_TOKEN,
          # so they are shape-checked before they go anywhere near either.
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]      || { echo "Refusing head SHA: $HEAD_SHA" >&2; exit 1; }
          [[ "$number"  =~ ^[0-9]+$ ]]             || { echo "Refusing PR number: $number" >&2; exit 1; }
          [[ "$branch"  =~ ^[A-Za-z0-9/_.-]+$ ]]   || { echo "Refusing head ref: $branch" >&2; exit 1; }
          [[ "$base"    =~ ^[A-Za-z0-9/_.-]+$ ]]   || { echo "Refusing base ref: $base" >&2; exit 1; }
          {
            echo "found=true"
            echo "number=$number"
            echo "branch=$branch"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the pull request head
        if: steps.pr.outputs.found == 'true'
        uses: actions/checkout@v7
        with:
          # refs/pull/N/head lives in THIS repo, so the sources arrive over git with their real
          # history — full depth so SonarQube can attribute new-code lines via git blame.
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          fetch-depth: 0
          # Nothing here pushes, and the checkout sits in a job holding SONAR_TOKEN: leaving a
          # credential in .git/config for fork-authored hooks or tooling to find buys nothing.
          persist-credentials: false

      # This is the load-bearing security step: everything Maven reads to decide what to run comes
      # from the base branch, so a fork cannot introduce a plugin, an extension, a wrapper script or
      # a Sonar exclusion into a job that holds SONAR_TOKEN.
      - name: Restore trusted build configuration from ${{ steps.pr.outputs.base }}
        if: steps.pr.outputs.found == 'true'
        env:
          BASE: ${{ steps.pr.outputs.base }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE"
          git checkout FETCH_HEAD -- pom.xml mvnw .mvn
          git status --short pom.xml mvnw .mvn

      - name: Set up Liberica JDK 26
        if: steps.pr.outputs.found == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: "26"
          cache: maven

      - name: Download the fork build's output
        if: steps.pr.outputs.found == 'true'
        uses: actions/download-artifact@v8
        with:
          name: sonar-inputs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack the build output
        if: steps.pr.outputs.found == 'true'
        run: |
          set -euo pipefail
          # Refuse an archive holding anything outside the directories fork-ci.yml packs, so a
          # crafted member cannot land elsewhere in the workspace — over pom.xml, say, which was
          # just restored from the base branch. Also rules out ../ traversal, failing the prefix.
          if tar -tzf sonar-inputs.tgz \
               | grep -vE '^target/(classes|test-classes|jacoco-report|surefire-reports)(/|$)' \
               | grep -q .; then
            echo "Refusing the artifact: it contains paths outside the staged directories." >&2
            exit 1
          fi
          tar -xzf sonar-inputs.tgz --no-same-owner
          test -d target/classes

      # The PR coordinates come from the resolved PR, not from this run's own context: the workflow
      # is triggered by a completed run on the base repo, so the scanner's GitHub Actions
      # auto-detection would otherwise report this as a branch rather than as a pull request.
      # Values arrive through env, never interpolated into the command line.
      - name: SonarQube Cloud analysis
        if: steps.pr.outputs.found == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_BRANCH: ${{ steps.pr.outputs.branch }}
          PR_BASE: ${{ steps.pr.outputs.base }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.pullrequest.key="$PR_NUMBER" \
            -Dsonar.pullrequest.branch="$PR_BRANCH" \
            -Dsonar.pullrequest.base="$PR_BASE" \
            -Dsonar.pullrequest.provider=github \
            -Dsonar.pullrequest.github.repository="$REPO" \
            -Dsonar.scm.revision="$HEAD_SHA"

      # The artifact carries a fork's compiled output and has served its purpose. Dropping it keeps
      # untrusted bytes from sitting in the repo's artifact storage for a day per fork push.
      - name: Delete the analysed artifact
        if: always() && steps.pr.outputs.found == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            for (const artifact of data.artifacts.filter(a => a.name === "sonar-inputs")) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
