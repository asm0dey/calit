# Build and test for pull requests raised from a fork.
#
# GitHub withholds repository secrets from `pull_request` runs whose head is a fork, so ci.yml's
# test job skips them (its analysis step would fail on an empty SONAR_TOKEN). This workflow builds
# them instead, with no secrets in reach, and hands the compiled output to sonar-fork.yml — which
# runs in the base repo's context, where SONAR_TOKEN exists.
#
# The build steps here MIRROR ci.yml's test job. Keep them in sync: a fork PR that is built
# differently from ours is a fork PR whose green tick means something different.
name: CI (fork PRs)

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & test (Maven)
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.fork }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so SonarQube can attribute new-code lines via git blame
          # Nothing here pushes, and the checkout is of fork-authored code.
          persist-credentials: false

      - name: Set up Liberica JDK 26
        uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: "26"
          cache: maven

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # The Tailwind/daisyUI stylesheet is gitignored and built by Bun; some tests
      # (e.g. StaticAssetsTest) serve it, so it must exist before `verify`.
      # --ignore-scripts is the one deliberate difference from ci.yml's twin of this step: the
      # package.json and lockfile here are fork-authored, and a lifecycle script is arbitrary code
      # execution on our runner. Nothing in the CSS build needs one — if that ever changes, the
      # `test -s` below fails loudly rather than shipping an unstyled build.
      - name: Build Tailwind + daisyUI CSS
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run css:build
          test -s src/main/resources/META-INF/resources/calit.css

      - name: Build and run tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      # Hand the compiled output to sonar-fork.yml. Sources and git history are NOT shipped — that
      # job re-checks-out refs/pull/N/head itself — so this carries only what cannot be rebuilt
      # without executing fork-authored code: the classes Sonar's Java analyser reads for
      # semantics, and the coverage and test reports. All of it is INPUT DATA to the scanner.
      - name: Stage Sonar inputs
        run: |
          set -euo pipefail
          # target/classes is mandatory — Sonar's Java analyser refuses to run without binaries.
          # The reports are best-effort: a run that produced none should still get an analysis.
          test -d target/classes
          staged=(target/classes)
          for d in target/test-classes target/jacoco-report target/surefire-reports; do
            # `if`, not `[ -d ] &&` — under `set -e` a false test as the last command of the loop
            # body aborts the step, so a missing report directory would fail the whole build.
            if [ -d "$d" ]; then staged+=("$d"); fi
          done
          tar -czf sonar-inputs.tgz "${staged[@]}"

      - name: Upload Sonar inputs
        uses: actions/upload-artifact@v7
        with:
          name: sonar-inputs
          path: sonar-inputs.tgz
          retention-days: 1
