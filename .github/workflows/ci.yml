name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request: {}

# Cancel superseded PR runs; never cancel an in-flight main/tag publish.
# Push runs get a per-SHA group so they never share a queue: GitHub keeps only ONE pending run
# per group and cancels the previously pending one, so a docs-only push landing while main
# CI is busy used to evict the queued run that was supposed to publish `edge` (cancel-in-progress
# does not protect a run that has not started yet). Per-SHA means push runs neither queue nor
# evict each other. PRs keep one group per ref so a new push still cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Build & test (Maven)
    runs-on: ubuntu-latest
    # Fork PRs are built by fork-ci.yml, which runs the same steps without secrets and hands its
    # output to sonar-fork.yml. Keep the two build step lists in sync.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so SonarQube can attribute new-code lines via git blame

      - name: Set up tools from mise.toml
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: "java bun"

      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      # The Tailwind/daisyUI stylesheet is gitignored and built by Bun; some tests
      # (e.g. StaticAssetsTest) serve it, so it must exist before `verify`.
      - name: Build Tailwind + daisyUI CSS
        run: |
          bun install --frozen-lockfile
          bun run css:build
          test -s src/main/resources/META-INF/resources/calit.css

      # .mvn/extensions.xml loads cribro (diff coverage) into every build; on a pull request it diffs
      # against the PR's base branch. It warns and goes on when that base does not resolve.
      - name: Build and run tests
        env:
          CRIBRO_ARGS: ${{ github.event_name == 'pull_request' && format('-Dcribro.diffBase=origin/{0}', github.base_ref) || '' }}
        run: |
          # shellcheck disable=SC2086 # CRIBRO_ARGS holds one argument, or none
          # -DskipITs: the *IT smoke tests run against the native binary in native-it, in parallel.
          ./mvnw --batch-mode --no-transfer-progress verify -DskipITs $CRIBRO_ARGS

      # cribro writes no report when the PR changed no Java lines it measures, and then nothing is
      # published.
      - name: Publish diff coverage to the job summary
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('target/cribro/diff-coverage.txt') != '' }}
        run: |
          {
            echo '## Diff coverage'
            echo '~~~~~text'
            head -c 60000 target/cribro/diff-coverage.txt
            echo
            echo '~~~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diff coverage for the PR comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: diff-coverage
          path: target/cribro/diff-coverage.txt
          if-no-files-found: ignore
          retention-days: 1

      # CI-based SonarQube Cloud analysis (Automatic Analysis is disabled for this project so the
      # sonar-maven-plugin's parameters in pom.xml — exclusions/ignores — are authoritative).
      # Reuses the target/ built by the verify step above. Fork PRs never reach this job at all
      # (see the job-level if): GitHub withholds secrets from pull_request runs whose head is a
      # fork, so they go through fork-ci.yml -> sonar-fork.yml instead. Keep the scanner arguments
      # there in sync with this line.
      - name: SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw --batch-mode --no-transfer-progress org.sonarsource.scanner.maven:sonar-maven-plugin:sonar


  # The *IT classes are native smoke tests: -Pnative compiles the native binary (glibc NIK container) and
  # failsafe runs them against it, catching request-time native failures (reflection, resources,
  # build-time init) that a green build hides. No secrets, so fork PRs run it here too.
  native-it:
    name: Native smoke ITs
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Bun from mise.toml
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: "bun"

      # JDK 25, not .sdkmanrc's 27: Maven must run on the NIK builder's JDK, because Qute generates
      # resolvers for the build JDK's own String/Map methods and native-image 25 rejects 27-only ones.
      - name: Set up Liberica JDK 25 (the NIK version)
        uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: "25"

      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Build Tailwind + daisyUI CSS
        run: |
          bun install --frozen-lockfile
          bun run css:build
          test -s src/main/resources/META-INF/resources/calit.css

      # AWT in the native binary needs freetype, fontconfig and at least one font on the host.
      - name: Install the AWT runtime libraries
        run: sudo apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core libfreetype6

      - name: Build the native binary and run the ITs against it
        run: ./mvnw --batch-mode --no-transfer-progress verify -Pnative

      # A reflection/init error can be logged on a request that still answered.
      - name: Fail on native reflection/init errors in the app log
        run: |
          test -s target/quarkus.log || { echo "::error::target/quarkus.log missing or empty"; exit 1; }
          if grep -iE 'NoSuchMethodException|InstantiationException|no accessible default constructor|UnsupportedFeatureException' target/quarkus.log; then
            echo "::error::native reflection/init error in target/quarkus.log"; exit 1
          fi

      - name: Upload the app log and failsafe reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-it-logs
          path: |
            target/quarkus.log
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  # A separate job so the token that can comment never shares a runner with the build.
  diff-coverage-comment:
    name: Comment diff coverage
    needs: test
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
    permissions:
      pull-requests: write
    steps:
      - name: Download the report
        continue-on-error: true # no artifact: the comment step clears any earlier report
        uses: actions/download-artifact@v8
        with:
          name: diff-coverage

      - name: Create or update the PR comment
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const marker = "<!-- cribro-diff-coverage -->";
            const hasReport = fs.existsSync("diff-coverage.txt");
            const content = hasReport
              ? `~~~~~text\n${fs.readFileSync("diff-coverage.txt", "utf8").slice(0, 60000)}\n~~~~~`
              : "No report for the latest push: it changed no measured Java lines, or cribro did not run.";
            const body = `${marker}\n## Diff coverage\n\n${content}`;
            const target = { owner: context.repo.owner, repo: context.repo.repo };
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...target,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...target, comment_id: existing.id, body });
            } else if (hasReport) {
              await github.rest.issues.createComment({ ...target, issue_number: context.issue.number, body });
            }

  scan:
    name: Vulnerability scan (Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Trivy filesystem scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # Docs/bean-only pushes to main produce a byte-identical image; skip the whole
  # image pipeline for them. Fails OPEN — anything we cannot diff with certainty
  # (tag push, unknown/zero `before` SHA, force-push over rewritten history)
  # reports code=true so a release is never silently skipped.
  # NOTE: this job only runs `if: github.event_name == 'push'`. If a future trigger
  # is added to the `on:` block above, either make this job run for it too, or make
  # sure build's `if:` below tolerates changes being skipped for that trigger.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the pushed commit range, not just its tip

      - name: Classify changed paths
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "not a main push (${GITHUB_REF}) -> code=true"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "no usable before SHA ('${BEFORE:-}') -> code=true"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- . \
            ':(exclude,glob)*.md' ':(exclude)docs/**' \
            ':(exclude).agents/**' ':(exclude).claude/**' ':(exclude)LICENSE') || {
            echo "git diff failed -> code=true"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ -n "$changed" ]; then
            echo "code changed:"; echo "$changed"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "only non-code paths changed -> skipping image build"
            git diff --name-only "$BEFORE" "$GITHUB_SHA"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.variant }} image (${{ matrix.arch }})
    needs: [test, changes, native-it]
    # !cancelled() drops the implicit success() gate GitHub applies over `needs:`,
    # so we restate needs.test.result explicitly — without it a red test suite
    # would start publishing images. native-it the same: no image ships whose binary failed the smoke ITs. `!= 'false'` (not `== 'true'`) means only an
    # explicitly-computed false skips the build; a failed/skipped changes job
    # (whose outputs evaluate to '') still builds, so a tagged release never
    # ships with no images.
    if: >-
      !cancelled() &&
      needs.test.result == 'success' &&
      needs.native-it.result == 'success' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      needs.changes.outputs.code != 'false'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # variant=jvm keeps the original fast-jar image (default tags); variant=native builds the
      # GraalVM image (Dockerfile.native, Alpaquita musl runtime) under -native suffixed tags.
      # Empty suffix => the jvm path is byte-identical to before.
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest, platform: linux/amd64, variant: jvm, file: ./Dockerfile, suffix: "" }
          - { arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64, variant: jvm, file: ./Dockerfile, suffix: "" }
          - { arch: amd64, runner: ubuntu-latest, platform: linux/amd64, variant: native, file: ./Dockerfile.native, suffix: "-native" }
          - { arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64, variant: native, file: ./Dockerfile.native, suffix: "-native" }
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Resolve build metadata
        id: buildmeta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
              echo "::error::tag $GITHUB_REF_NAME is not a supported semantic version"
              exit 1
            fi
          else
            version="edge"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore build caches (.m2, bun)
        uses: actions/cache@v6
        with:
          path: |
            var-cache-m2
            var-cache-bun
          key: buildcache-${{ matrix.arch }}${{ matrix.suffix }}-${{ hashFiles('pom.xml', 'bun.lock') }}
          restore-keys: |
            buildcache-${{ matrix.arch }}${{ matrix.suffix }}-

      - name: Inject caches into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "var-cache-m2": "/root/.m2",
              "var-cache-bun": "/root/.bun/install/cache"
            }
          skip-extraction: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

      # Build the single-arch image locally (no push) and Trivy-scan it BEFORE any
      # GHCR push. If HIGH/CRITICAL vulns are found this step fails the job and the
      # push-by-digest step below never runs, so a vulnerable image never reaches GHCR.
      # The buildx gha cache makes the subsequent push build a near-no-op.
      - name: Build image locally for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: calit:scan-${{ matrix.arch }}${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.arch }}${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}${{ matrix.suffix }}
          build-args: |
            APP_VERSION=${{ steps.buildmeta.outputs.version }}
            GIT_COMMIT=${{ steps.buildmeta.outputs.commit }}

      - name: Trivy image scan (fail on HIGH/CRITICAL) before push
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: calit:scan-${{ matrix.arch }}${{ matrix.suffix }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # Boot the just-built image and check only what the image adds on top of the binary: the runtime
      # .so files and fonts (calit-o89d: /og.png fails when the image has none), the APP_VERSION/
      # GIT_COMMIT build args, and a clean boot log. App behaviour (argon2id, Qute pages, JSON, ICS,
      # DB-backed cards) is covered by the *IT classes, which native-it runs against the native binary.
      # Runs for BOTH variants. The Google freeBusy path can't be smoked anywhere (needs real OAuth
      # tokens) -- it relies on the -H:Preserve flags in application.properties.
      - name: Smoke test image
        run: |
          set -euo pipefail
          IMG=calit:scan-${{ matrix.arch }}${{ matrix.suffix }}
          docker network create smoke
          docker run -d --name pg --network smoke \
            -e POSTGRES_USER=calit -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=calit postgres:16-alpine
          for _ in $(seq 1 60); do docker exec pg pg_isready -U calit >/dev/null 2>&1 && break; sleep 1; done
          docker run -d --name app --network smoke -p 8080:8080 \
            -e DB_URL=jdbc:postgresql://pg:5432/calit -e DB_USER=calit -e DB_PASSWORD=pw \
            -e SESSION_ENCRYPTION_KEY=ci-smoke-session-key-0123456789-abcdef \
            -e TOKEN_ENCRYPTION_KEY=1111111111111111111111111111111111111111111111111111111111111111 \
            -e APP_BASE_URL=http://localhost:8080 -e MAIL_HOST=localhost -e QUARKUS_MAILER_MOCK=true \
            -e GOOGLE_OAUTH_CLIENT_ID=dummy -e GOOGLE_OAUTH_CLIENT_SECRET=dummy \
            -e GOOGLE_OAUTH_STATE_SECRET=ci-smoke-state-secret-0123456789-abcd \
            "$IMG"
          ready=""
          for _ in $(seq 1 120); do
            if curl -fs http://localhost:8080/q/health/ready >/dev/null 2>&1; then ready=1; break; fi
            docker ps -q -f name=app -f status=running | grep -q . || { echo "::error::app container exited during boot"; break; }
            sleep 1
          done
          if [ -z "$ready" ]; then echo "::error::image did not become ready"; docker logs app; exit 1; fi
          # build-arg metadata reaches the footer; /setup renders on the empty DB
          curl -fs http://localhost:8080/setup -o /tmp/setup.html
          grep -Fq '<span>${{ steps.buildmeta.outputs.version }} &middot; ${{ steps.buildmeta.outputs.commit }}</span>' /tmp/setup.html || { echo "::error::/setup footer does not contain expected build metadata"; docker logs app; exit 1; }
          # the card is build-green and request-red when the image lacks AWT's .so files or any font
          curl -fs http://localhost:8080/og.png -o /tmp/og.png
          head -c 4 /tmp/og.png | grep -q 'PNG' || { echo "::error::/og.png is not a PNG"; docker logs app; exit 1; }
          # Fail on reflection/init errors even if a request happened to return non-fatally.
          if docker logs app 2>&1 | grep -iE 'NoSuchMethodException|InstantiationException|no accessible default constructor|UnsupportedFeatureException'; then
            echo "::error::native reflection/init error in logs"; exit 1
          fi
          echo "image smoke test passed"
          docker rm -f app pg >/dev/null 2>&1 || true

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.arch }}${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}${{ matrix.suffix }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_VERSION=${{ steps.buildmeta.outputs.version }}
            GIT_COMMIT=${{ steps.buildmeta.outputs.commit }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest (${{ matrix.variant }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: jvm, suffix: "", kind: "JVM (JIT-compiled) on a hardened distroless Liberica JRE (musl)" }
          - { variant: native, suffix: "-native", kind: "native (AOT-compiled with Liberica Native Image Kit, no JVM) on Alpaquita Linux (musl)" }
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          # Same tags on both registries; imagetools copies the GHCR digests to Docker Hub, no rebuild.
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ github.repository }}
          # Empty suffix for jvm (tags unchanged); "-native" for the GraalVM variant
          # => edge-native, 1.10.0-native, 1.10-native, sha-<sha>-native.
          # onlatest=true makes the auto ":latest" tag (emitted on semver git tags) carry the
          # suffix too: jvm => :latest, native => :latest-native. Without it both variants would
          # push a bare ":latest" and race/clobber each other.
          flavor: suffix=${{ matrix.suffix }},onlatest=true
          # Multi-arch manifest lists carry the description as an index annotation (GHCR reads it there).
          annotations: |
            org.opencontainers.image.description=calit: self-hosted, multi-user Calendly alternative (Quarkus, Postgres). ${{ matrix.kind }} build.
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Annotations contain spaces, so build them as an array rather than word-splitting jq output.
          mapfile -t annotations < <(jq -r '.annotations[] | "--annotation", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046
          docker buildx imagetools create "${annotations[@]}" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"

  release:
    name: Create GitHub Release
    needs: [test, merge]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for generated release notes

      - name: Create release with generated notes
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Absolutise README links for Docker Hub
        # Hub renders the README out of repo context: point relative images at raw/, other links at blob/.
        run: |
          sed -E -e 's#!\[([^]]*)\]\(([^):#]+)\)#![\1](https://github.com/${{ github.repository }}/raw/main/\2)#g' \
                 -e 's#\]\(([^):#]+)\)#](https://github.com/${{ github.repository }}/blob/main/\1)#g' \
                 README.md > "$RUNNER_TEMP/README.hub.md"

      - name: Sync Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ github.repository }}
          short-description: Self-hosted, multi-user Calendly alternative (Quarkus, Postgres)
          readme-filepath: ${{ runner.temp }}/README.hub.md
