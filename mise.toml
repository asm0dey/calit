# Tool versions for local dev and CI (jdx/mise-action). Renovate bumps these.
# Java lives in .sdkmanrc so sdkman users (sdkman_auto_env) and mise read one pin; bump it by hand,
# Renovate has no sdkman manager. Maven is not here: ./mvnw pins it.
[settings]
idiomatic_version_file_enable_tools = ["java"]

[tools]
bun = "1.4.4"
"github:hmans/beans" = "0.4.2"
actionlint = "1.7.12"

# `mise install` alone leaves a clone with lefthook + git hooks + pinned Prettier (bun install -> prepare ->
# lefthook install). Skipped in CI: workflows run their own `bun install` (fork-ci with --ignore-scripts).
[hooks]
# Windows runs inline commands with `cmd /c`, which has no `[`: hence run_windows here and on the tasks below.
postinstall = { run = '[ -n "$CI" ] || bun install', run_windows = "if not defined CI bun install" }

# Thin wrappers: the commands themselves live in package.json / mvnw (Dockerfiles call them without mise).
[tasks.setup]
description = "Install frontend deps + git hooks, restore agent skills"
run = ["bun install", "bunx skills experimental_install"]

[tasks.css]
description = "Build /calit.css once"
run = "bun run css:build"

[tasks.dev]
description = "Dev server at :8080 (Docker required); rebuilds CSS on change"
depends = ["css"]
# css:watch runs as a background job in its own process group (set -m), so Ctrl-C only reaches
# Quarkus; the trap kills the whole watcher group (bun + its tailwind child) when dev exits.
run = """
set -m
bun run css:watch & watcher=$!
trap 'kill -- -$watcher 2>/dev/null' EXIT INT TERM
./mvnw quarkus:dev
"""
# shortcut: cmd has no job control, so the CSS watcher outlives Ctrl-C (close it with its window); write a
# pwsh script if Windows contributors complain.
run_windows = 'start "css:watch" bun run css:watch & mvnw.cmd quarkus:dev'

[tasks.build]
description = "CSS + ./mvnw package (runs tests, Docker required); extra args go to Maven, e.g. -DskipTests"
depends = ["css"]
run = "./mvnw package"
run_windows = "mvnw.cmd package"

[tasks.test]
description = "Full test suite (Docker required); extra args go to Maven, e.g. -Dtest=BookingServiceTest"
run = "./mvnw test"
run_windows = "mvnw.cmd test"

[tasks.format]
description = "Format Java + JS/CSS"
run = "bun run format"

[tasks.lint-ci]
description = "Lint GitHub Actions workflows"
run = "actionlint"
