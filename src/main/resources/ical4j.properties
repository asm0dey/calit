# Read by ical4j's Configurator when its classes load. Relaxed parsing/unfolding tolerates the
# ordinary quirks real CalDAV servers emit (blank lines, sloppy folding) instead of rejecting
# the whole object; BusyExtractor fails closed on anything still unreadable.
ical4j.parsing.relaxed=true
ical4j.unfolding.relaxed=true
