{@java.lang.String title}
{@java.lang.Boolean nothingLeft}
{#include base title=title}
  <div class="card bg-base-100 border border-base-300 shadow-sm max-w-xl mx-auto">
    <div class="card-body items-start">
      {#if nothingLeft}
      <h1 class="text-2xl font-bold">{msg:pub_cancel_all_nothing_h1}</h1>
      <p class="text-base-content/70">{msg:pub_cancel_all_nothing_desc}</p>
      {#else}
      <h1 class="text-2xl font-bold">{msg:pub_cancelled_h1}</h1>
      <p class="text-base-content/70">{msg:pub_cancelled_desc}</p>
      {/if}
      <a class="btn btn-primary mt-2" href="/">{msg:pub_cancelled_btn}</a>
    </div>
  </div>
{/include}
