{! Built-in invitee field modes (GH #130), passed as FieldMode values (the create form passes FieldMode:REQUIRED etc. as its defaults). !}
{@java.lang.String idPrefix}
{@site.asm0dey.calit.domain.MeetingType$FieldMode nameMode}
{@site.asm0dey.calit.domain.MeetingType$FieldMode guestsMode}
<label class="label" for="{idPrefix}-name-mode">{adm:adm_meetingTypes_label_name_mode}</label>
<select id="{idPrefix}-name-mode" class="select w-full" name="nameMode">
  <option value="REQUIRED"{#if nameMode == FieldMode:REQUIRED} selected{/if}>{adm:adm_meetingTypes_mode_required}</option>
  <option value="OPTIONAL"{#if nameMode == FieldMode:OPTIONAL} selected{/if}>{adm:adm_meetingTypes_mode_optional}</option>
  <option value="HIDDEN"{#if nameMode == FieldMode:HIDDEN} selected{/if}>{adm:adm_meetingTypes_mode_hidden}</option>
</select>
<label class="label" for="{idPrefix}-guests-mode">{adm:adm_meetingTypes_label_guests_mode}</label>
<select id="{idPrefix}-guests-mode" class="select w-full" name="guestsMode">
  <option value="OPTIONAL"{#if guestsMode == FieldMode:OPTIONAL} selected{/if}>{adm:adm_meetingTypes_mode_optional}</option>
  <option value="HIDDEN"{#if guestsMode == FieldMode:HIDDEN} selected{/if}>{adm:adm_meetingTypes_mode_hidden}</option>
</select>
